name: "dotnet-format-plus"

description: "Run dotnet format & JSCPD and optionally apply any fixes"

branding:
  icon: "navigation-2"
  color: "green"

inputs:
  authToken:
    description: "The GITHUB_TOKEN secret"
    required: true

  action:
    description: "check|fix. The primary action `dotnet format` should perform. `check` for only checking, `fix` will also actually fix the formatting errors in the files."
    required: false
    default: "fix"

  projectFileName:
    description: "The solution or project file to operate on."
    required: false
    default: ""

  onlyChangedFiles:
    description: "Only changed files in the current pull request should be formatted. Only works when the trigger is a pull request."
    required: false
    default: false

  failFast:
    description: "The job should fail if there's a formatting error."
    required: false
    default: true

  workspace:
    description: "The solution or project file to operate on."
    required: true

  nugetConfigPath:
    description: "The path to the NuGet configuration file from workspace. e.g. `NuGet.config`"
    required: false
    default: ""

  severityLevel:
    description: " <error|info|warn> Fixes styles according to formatting rules."
    required: false
    default: "warn"

  logLevel:
    description: "Sets the logging verbosity of the dotnet format process. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]"
    required: false
    default: "detailed"

  problemMatcherEnabled:
    description: "Enable the problem matcher for dotnet format."
    required: false
    default: true

  skipCommit:
    description: "Skip commiting the changes to the repository."
    required: false
    default: false

  commitUserName:
    description: Name used for the commit user
    required: false
    default: "github-actions"

  commitUserEmail:
    description: Email address used for the commit user
    required: false
    default: "bot@users.noreply.github.com"

  commitMessage:
    description: Message used for the commit
    required: false
    default: "🤖 refactor: Apply dotnet-format changes"

  dotnetFormatConfigPath:
    description: "Path to dotnet format config file"
    required: false
    default: ".dotnet-format.json"

  jscpdCheck:
    description: "Run jscpd to check for code duplication"
    required: false
    default: false

  jscpdConfigPath:
    description: "Path to jscpd config file"
    required: false
    default: ".jscpd.json"

  jscpdCheckAsError:
    description: "Fail the build if jscpd finds any code duplication"
    required: false
    default: false

  postNewComment:
    description: "Post a new comment on the pull request or update an existing one with the results"
    required: false
    default: false

  jscpdReportArtifactName:
    description: "Name of the artifact containing the JSCPD report"
    required: false
    default: "jscpd-report"

  dotnetFormatReportArtifactName:
    description: "Name of the artifact containing the dotnet format report"
    required: false
    default: "dotnet-format-report"

outputs:
  hasChanges:
    description: "A value indicating if any files were formatted. If `action` is `check` we will inspect the exit code of `dotnet format` to be <> 0. If `action` is `fix` we see if there are changes to files with `git status -s`."
    value: ${{ steps.format.outputs.hasChanges }}
  hasDuplicates:
    description: "A value indicating if any files were duplicated when `jscpdCheck` is `true`."
    value: ${{ steps.jscpd.outputs.hasDuplicates }}

runs:
  using: "composite"
  steps:
    # --------------------------------------------------------------------------
    # Setup
    # --------------------------------------------------------------------------
    - name: "🛠️ Setup dotnet environment"
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=true" >> "$GITHUB_ENV"
        echo "DOTNET_NOLOGO=true" >> "$GITHUB_ENV"
        echo "🔍 cwd: $(pwd)"

    - name: "➕ Add problem matcher"
      if: ${{ inputs.problemMatcherEnabled == 'true' }}
      shell: bash
      run: echo "::add-matcher::${{ github.action_path }}/problem-matcher.json"

    # --------------------------------------------------------------------------
    # dotnet format  (Phase 3 — T6..T11)
    # --------------------------------------------------------------------------
    - name: "🧩 Resolve dotnet format config"
      id: resolve-config
      shell: bash
      run: |
        echo "::notice::TODO Phase 3 (T6): resolve config via read-config.mjs + format-args.mjs -> $RUNNER_TEMP/df-config.json"

    - name: "🔀 Resolve changed files"
      id: changed-files
      if: ${{ inputs.onlyChangedFiles == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      run: |
        echo "::notice::TODO Phase 3 (T7): list PR changed files via github-script"

    - name: "🏃 Run dotnet format"
      id: dotnet-format
      shell: bash
      run: |
        echo "::notice::TODO Phase 3 (T8): run dotnet format per enabled block from df-config.json"

    - name: "📝 Post dotnet format report"
      id: format-report
      shell: bash
      run: |
        echo "::notice::TODO Phase 3 (T9): build markdown via dotnet-report.mjs, set summary + PR comment"

    - name: "📦 Upload dotnet format report"
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.dotnetFormatReportArtifactName }}
        path: ${{ github.workspace }}/.dotnet-format
        if-no-files-found: ignore

    - name: "💾 Commit & push fixes"
      id: format
      shell: bash
      run: |
        echo "::notice::TODO Phase 3 (T11): git commit/push with rebase-retry; set hasChanges"
        echo "hasChanges=false" >> "$GITHUB_OUTPUT"

    - name: "➖ Remove problem matcher"
      if: ${{ inputs.problemMatcherEnabled == 'true' }}
      shell: bash
      run: echo "::remove-matcher owner=dotnet-format-plus::"

    # --------------------------------------------------------------------------
    # jscpd  (Phase 4 — T12..T14)
    # --------------------------------------------------------------------------
    - name: "🔎 Run jscpd"
      id: jscpd-run
      if: ${{ inputs.jscpdCheck == 'true' }}
      shell: bash
      run: |
        echo "::notice::TODO Phase 4 (T12): resolve jscpd/cpd or npx jscpd@5 and run with json,markdown,console-full reporters"

    - name: "📝 Post jscpd report"
      id: jscpd
      if: ${{ inputs.jscpdCheck == 'true' }}
      shell: bash
      run: |
        echo "::notice::TODO Phase 4 (T13): threshold, annotations, comment, summary via jscpd-report.mjs; set hasDuplicates"
        echo "hasDuplicates=false" >> "$GITHUB_OUTPUT"

    - name: "📦 Upload jscpd report"
      if: ${{ inputs.jscpdCheck == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.jscpdReportArtifactName }}
        path: ${{ github.workspace }}/${{ inputs.jscpdReportArtifactName }}
        if-no-files-found: ignore

    # --------------------------------------------------------------------------
    # Fail handling  (Phase 5 — T15)
    # --------------------------------------------------------------------------
    - name: "🚦 Fail fast on format issues"
      if: ${{ inputs.failFast == 'true' }}
      shell: bash
      run: |
        echo "::notice::TODO Phase 5 (T15): fail the action when dotnet format reported issues"
