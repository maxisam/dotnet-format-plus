name: "dotnet-format-plus"

description: "Run dotnet format & JSCPD and optionally apply any fixes"

branding:
  icon: "navigation-2"
  color: "green"

inputs:
  authToken:
    description: "The GITHUB_TOKEN secret"
    required: true

  action:
    description: "check|fix. The primary action `dotnet format` should perform. `check` for only checking, `fix` will also actually fix the formatting errors in the files."
    required: false
    default: "fix"

  projectFileName:
    description: "The solution or project file to operate on."
    required: false
    default: ""

  onlyChangedFiles:
    description: "Only changed files in the current pull request should be formatted. Only works when the trigger is a pull request."
    required: false
    default: false

  failFast:
    description: "The job should fail if there's a formatting error."
    required: false
    default: true

  workspace:
    description: "The solution or project file to operate on."
    required: true

  nugetConfigPath:
    description: "The path to the NuGet configuration file from workspace. e.g. `NuGet.config`"
    required: false
    default: ""

  severityLevel:
    description: " <error|info|warn> Fixes styles according to formatting rules."
    required: false
    default: "warn"

  logLevel:
    description: "Sets the logging verbosity of the dotnet format process. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]"
    required: false
    default: "detailed"

  problemMatcherEnabled:
    description: "Enable the problem matcher for dotnet format."
    required: false
    default: true

  skipCommit:
    description: "Skip commiting the changes to the repository."
    required: false
    default: false

  commitUserName:
    description: Name used for the commit user
    required: false
    default: "github-actions"

  commitUserEmail:
    description: Email address used for the commit user
    required: false
    default: "bot@users.noreply.github.com"

  commitMessage:
    description: Message used for the commit
    required: false
    default: "🤖 refactor: Apply dotnet-format changes"

  dotnetFormatConfigPath:
    description: "Path to dotnet format config file"
    required: false
    default: ".dotnet-format.json"

  jscpdCheck:
    description: "Run jscpd to check for code duplication"
    required: false
    default: false

  jscpdConfigPath:
    description: "Path to jscpd config file"
    required: false
    default: ".jscpd.json"

  jscpdCheckAsError:
    description: "Fail the build if jscpd finds any code duplication"
    required: false
    default: false

  postNewComment:
    description: "Post a new comment on the pull request or update an existing one with the results"
    required: false
    default: false

  jscpdReportArtifactName:
    description: "Name of the artifact containing the JSCPD report"
    required: false
    default: "jscpd-report"

  dotnetFormatReportArtifactName:
    description: "Name of the artifact containing the dotnet format report"
    required: false
    default: "dotnet-format-report"

outputs:
  hasChanges:
    description: "A value indicating if any files were formatted. If `action` is `check` we will inspect the exit code of `dotnet format` to be <> 0. If `action` is `fix` we see if there are changes to files with `git status -s`."
    value: ${{ steps.format.outputs.hasChanges }}
  hasDuplicates:
    description: "A value indicating if any files were duplicated when `jscpdCheck` is `true`."
    value: ${{ steps.jscpd.outputs.hasDuplicates }}

runs:
  using: "composite"
  steps:
    # --------------------------------------------------------------------------
    # Setup
    # --------------------------------------------------------------------------
    - name: "🛠️ Setup dotnet environment"
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=true" >> "$GITHUB_ENV"
        echo "DOTNET_NOLOGO=true" >> "$GITHUB_ENV"
        echo "🔍 cwd: $(pwd)"

    - name: "➕ Add problem matcher"
      if: ${{ inputs.problemMatcherEnabled == 'true' }}
      shell: bash
      run: echo "::add-matcher::${{ github.action_path }}/problem-matcher.json"

    # --------------------------------------------------------------------------
    # dotnet format  (Phase 3 — T6..T11)
    # --------------------------------------------------------------------------
    - name: "🧩 Resolve dotnet format config & changed files"
      id: resolve-config
      uses: actions/github-script@v9
      env:
        ACTION: ${{ inputs.action }}
        SEVERITY_LEVEL: ${{ inputs.severityLevel }}
        LOG_LEVEL: ${{ inputs.logLevel }}
        NUGET_CONFIG_PATH: ${{ inputs.nugetConfigPath }}
        DOTNET_FORMAT_CONFIG_PATH: ${{ inputs.dotnetFormatConfigPath }}
        PROJECT_FILE_NAME: ${{ inputs.projectFileName }}
        ONLY_CHANGED_FILES: ${{ inputs.onlyChangedFiles }}
        WORKSPACE: ${{ inputs.workspace }}
      with:
        github-token: ${{ inputs.authToken }}
        script: |
          const { pathToFileURL } = require('node:url');
          const url = pathToFileURL(`${process.env.GITHUB_ACTION_PATH}/scripts/steps/resolve-config.mjs`).href;
          const { run } = await import(url);
          await run({ github, context, core, exec });

    - name: "🏃 Run dotnet format"
      id: dotnet-format
      shell: bash
      run: |
        set -uo pipefail
        PLAN="$RUNNER_TEMP/df-config.json"
        WORKSPACE=$(jq -r '.workspace' "$PLAN")
        NUGET=$(jq -r '.nugetConfigPath' "$PLAN")
        REPORT_DIR=$(jq -r '.reportDir' "$PLAN")
        mkdir -p "$REPORT_DIR"

        if [ -n "$NUGET" ] && [ "$NUGET" != "null" ]; then
          echo "::group::📦 Nuget Restore"
          # Restore failures are infrastructure failures: fail unconditionally
          # (the original action threw on a non-zero restore too).
          if ! dotnet restore -p:RestoreConfigFile="${WORKSPACE}${NUGET}" "${WORKSPACE}"; then
            echo "::endgroup::"
            echo "::error title=DOTNET FORMAT Check::dotnet restore failed"
            exit 1
          fi
          echo "::endgroup::"
        fi

        count=$(jq '.commands | length' "$PLAN")
        echo "Running $count dotnet format command(s)"
        format_result=true
        exec_failed=false
        for i in $(seq 0 $((count - 1))); do
          readarray -t args < <(jq -r ".commands[$i][]" "$PLAN")
          echo "::group::🏃 dotnet ${args[*]}"
          out=$(dotnet "${args[@]}" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          echo "::endgroup::"
          last=$(printf '%s\n' "$out" | tail -n 1)
          if ! printf '%s' "$last" | grep -q 'Format complete'; then
            # No completion marker: dotnet did not finish a format pass. A non-zero
            # exit here is an execution failure (missing SDK, invalid workspace,
            # crash) that must fail regardless of failFast — distinct from formatting
            # findings, which still end stdout with "Format complete".
            format_result=false
            if [ "$rc" -ne 0 ]; then
              echo "::error title=DOTNET FORMAT Check::dotnet format did not complete (exit $rc)"
              exec_failed=true
            fi
          fi
          if printf '%s' "$out" | grep -q 'Unable to fix'; then
            echo "::error title=DOTNET FORMAT Check::Unable to fix all formatting issues"
            format_result=false
          fi
        done
        echo "formatResult=$format_result" >> "$GITHUB_OUTPUT"

        # Infrastructure/runner failures fail unconditionally; formatting findings
        # remain gated by the failFast step. The per-command ::error:: above already
        # annotated the failure, so just exit here.
        if [ "$exec_failed" = "true" ]; then
          echo "dotnet format failed to execute (see error above)"
          exit 1
        fi

        if [ "$format_result" = "true" ]; then
          echo "::notice title=DOTNET FORMAT Check::✅ DOTNET FORMAT SUCCESS"
        else
          echo "::error title=DOTNET FORMAT Check::DOTNET FORMAT FAILED"
        fi

    - name: "📦 Upload dotnet format report"
      if: ${{ always() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.dotnetFormatReportArtifactName }}
        path: ${{ github.workspace }}/.dotnet-format
        if-no-files-found: ignore

    - name: "📝 Post dotnet format report"
      id: format-report
      uses: actions/github-script@v9
      env:
        WORKSPACE: ${{ inputs.workspace }}
        REPORT_DIR: ${{ github.workspace }}/.dotnet-format
        POST_NEW_COMMENT: ${{ inputs.postNewComment }}
      with:
        github-token: ${{ inputs.authToken }}
        script: |
          const { pathToFileURL } = require('node:url');
          const url = pathToFileURL(`${process.env.GITHUB_ACTION_PATH}/scripts/steps/format-report.mjs`).href;
          const { run } = await import(url);
          await run({ github, context, core });

    - name: "💾 Commit & push fixes"
      id: format
      shell: bash
      env:
        SKIP_COMMIT: ${{ inputs.skipCommit }}
        COMMIT_USER_NAME: ${{ inputs.commitUserName }}
        COMMIT_USER_EMAIL: ${{ inputs.commitUserEmail }}
        COMMIT_MESSAGE: ${{ inputs.commitMessage }}
      run: |
        # errexit so a failed fetch/stash/checkout/add/commit aborts instead of
        # falling through to the push loop and reporting success. The push itself
        # expects non-zero exit codes and is guarded with `set +e`/`set -e` below.
        set -euo pipefail
        PLAN="$RUNNER_TEMP/df-config.json"
        REPORT_DIR=$(jq -r '.reportDir' "$PLAN")
        IS_DRY_RUN=$(jq -r '.isDryRun' "$PLAN")

        # Remove report files so they don't count as changes or get committed.
        rm -rf "$REPORT_DIR"

        if [ "$IS_DRY_RUN" = "true" ]; then
          echo "::notice title=DOTNET FORMAT Check::Dry run mode. No changes will be committed."
          echo "hasChanges=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$(git status -s)" ]; then
          echo "Did not find any changed files"
          echo "hasChanges=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::warning title=DOTNET FORMAT Check::Dotnet Format File Changed: true"
        echo "hasChanges=true" >> "$GITHUB_OUTPUT"

        if [ "$SKIP_COMMIT" = "true" ] || [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "Skipping commit (skipCommit=$SKIP_COMMIT, event=$GITHUB_EVENT_NAME)"
          exit 0
        fi

        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        echo "Current branch: \"$BRANCH\""
        CWD="$(pwd)"

        git config --global --add safe.directory "$CWD" || true
        git config user.name "$COMMIT_USER_NAME"
        git config user.email "$COMMIT_USER_EMAIL"
        git config core.ignorecase false

        CURRENT=$(git branch --show-current)
        if [ "$CURRENT" != "$BRANCH" ]; then
          echo "On \"$CURRENT\"; checking out \"$BRANCH\""
          git fetch origin "$BRANCH" --depth=1
          git stash
          git checkout -b "$BRANCH" FETCH_HEAD
          git stash pop
        fi

        git add .
        git commit -m "$COMMIT_MESSAGE"

        attempt=1
        while [ "$attempt" -le 3 ]; do
          echo "Pushing changes… (attempt $attempt of 3)"
          ERR_LOG="$RUNNER_TEMP/df-push-err.log"
          set +e
          push_out=$(git push --porcelain origin "$BRANCH:$BRANCH" 2>"$ERR_LOG")
          set -e
          push_err=$(cat "$ERR_LOG" 2>/dev/null || true)
          rm -f "$ERR_LOG"
          if printf '%s' "$push_out" | grep -qE '\[rejected\]|\[remote rejected\]'; then
            echo "Updates were rejected; fetching and rebasing onto $BRANCH"
            git fetch
            git pull --rebase
          elif printf '%s' "$push_err" | grep -q '^fatal:'; then
            echo "$push_err"
            exit 1
          else
            echo "Changes pushed"
            exit 0
          fi
          attempt=$((attempt + 1))
        done
        echo "Attempt limit exceeded"
        exit 1

    - name: "➖ Remove problem matcher"
      if: ${{ inputs.problemMatcherEnabled == 'true' }}
      shell: bash
      run: echo "::remove-matcher owner=dotnet-format-plus::"

    # --------------------------------------------------------------------------
    # jscpd  (Phase 4 — T12..T14)
    # --------------------------------------------------------------------------
    - name: "🔎 Run jscpd"
      id: jscpd-run
      if: ${{ inputs.jscpdCheck == 'true' }}
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        ARTIFACT_NAME: ${{ inputs.jscpdReportArtifactName }}
        JSCPD_CONFIG_PATH: ${{ inputs.jscpdConfigPath }}
      run: |
        set -uo pipefail
        if [ -f "$WORKSPACE" ]; then SCAN=$(dirname "$WORKSPACE"); else SCAN="$WORKSPACE"; fi
        OUT="$GITHUB_WORKSPACE/$ARTIFACT_NAME"
        CFGNAME="${JSCPD_CONFIG_PATH:-.jscpd.json}"

        # Config file for --config: first existing of scanPath/<name> then cwd/<name>.
        CONFIG=""
        if [ -f "$SCAN/$CFGNAME" ]; then
          CONFIG="$SCAN/$CFGNAME"
        elif [ -f "$CFGNAME" ]; then
          CONFIG="$(pwd)/$CFGNAME"
        fi

        # Prefer an installed jscpd/cpd, otherwise fall back to a one-off npx download.
        if command -v jscpd >/dev/null 2>&1; then
          BIN=(jscpd); echo "Using installed jscpd"
        elif command -v cpd >/dev/null 2>&1; then
          BIN=(cpd); echo "Using installed cpd"
        else
          echo "No jscpd CLI on PATH; falling back to npx jscpd@5"; BIN=(npx --yes jscpd@5)
        fi

        args=("$SCAN" --reporters json,markdown,console-full --output "$OUT")
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi

        echo "::group::🔎 Running jscpd 5"
        echo "${BIN[*]} ${args[*]}"
        # jscpd exits non-zero when the threshold is exceeded; we evaluate the report
        # ourselves in the next step, so don't fail here.
        "${BIN[@]}" "${args[@]}" || true
        echo "::endgroup::"

        echo "scanPath=$SCAN" >> "$GITHUB_OUTPUT"
        echo "outputDir=$OUT" >> "$GITHUB_OUTPUT"

    - name: "📝 Post jscpd report"
      id: jscpd
      if: ${{ inputs.jscpdCheck == 'true' }}
      uses: actions/github-script@v9
      env:
        WORKSPACE: ${{ inputs.workspace }}
        SCAN_PATH: ${{ steps.jscpd-run.outputs.scanPath }}
        OUTPUT_DIR: ${{ steps.jscpd-run.outputs.outputDir }}
        JSCPD_CONFIG_PATH: ${{ inputs.jscpdConfigPath }}
        JSCPD_CHECK_AS_ERROR: ${{ inputs.jscpdCheckAsError }}
        POST_NEW_COMMENT: ${{ inputs.postNewComment }}
      with:
        github-token: ${{ inputs.authToken }}
        script: |
          const { pathToFileURL } = require('node:url');
          const url = pathToFileURL(`${process.env.GITHUB_ACTION_PATH}/scripts/steps/jscpd-report.mjs`).href;
          const { run } = await import(url);
          await run({ github, context, core, exec });

    - name: "📦 Upload jscpd report"
      if: ${{ always() && inputs.jscpdCheck == 'true' }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.jscpdReportArtifactName }}
        path: ${{ github.workspace }}/${{ inputs.jscpdReportArtifactName }}
        if-no-files-found: ignore

    - name: "🧹 Clean up jscpd report dir"
      # Runs after the artifact upload (always, even when the report step failed the
      # build) so the report dir is not left in the workspace — mirrors the original
      # io.rmRF(outputDir) and avoids polluting downstream git status / repeat runs.
      if: ${{ always() && inputs.jscpdCheck == 'true' }}
      shell: bash
      env:
        OUTPUT_DIR: ${{ steps.jscpd-run.outputs.outputDir }}
        ARTIFACT_NAME: ${{ inputs.jscpdReportArtifactName }}
      run: |
        set -uo pipefail
        DIR="$OUTPUT_DIR"
        if [ -z "$DIR" ] && [ -n "$ARTIFACT_NAME" ]; then
          DIR="$GITHUB_WORKSPACE/$ARTIFACT_NAME"
        fi
        if [ -n "$DIR" ] && [ "$DIR" != "$GITHUB_WORKSPACE" ] && [ "$DIR" != "/" ]; then
          echo "Removing jscpd report dir: $DIR"
          rm -rf "$DIR"
        fi

    # --------------------------------------------------------------------------
    # Fail handling  (Phase 5 — T15)
    # --------------------------------------------------------------------------
    - name: "🚦 Fail fast on format issues"
      if: ${{ inputs.failFast == 'true' && steps.dotnet-format.outputs.formatResult == 'false' }}
      shell: bash
      run: |
        echo "::error title=DOTNET FORMAT Check::Action failed with format issue"
        exit 1
